backend:
  type: tinker
  base_url: http://localhost:10651
  api_key: tml-tuft-dev-key
  base_model: qwen3-4b
tenants:
- id: gsm8k-A
  task: gsm8k
  request_rate: 8.0
  buffer_size: 32
  num_train_steps: 10
  lora_rank: 8
  learning_rate: 0.0001
  max_tokens: 768
  temperature: 0.7
  staleness_limit: 0
  sync_mode: false
  async_sampling: true
  async_sampling_concurrency: 16
- id: gsm8k-shared
  task: gsm8k
  request_rate: 8.0
  buffer_size: 32
  num_train_steps: 10
  lora_rank: 8
  learning_rate: 0.0001
  max_tokens: 768
  temperature: 0.7
  staleness_limit: 0
  sync_mode: false
  async_sampling: true
  async_sampling_concurrency: 16
evaluation:
  eval_interval_steps: 0
  eval_sample_size: 0
logprob_collection:
  enabled: false
  dump_per_token: false
request_arrival_logging:
  enabled: true
output_path: results.json
seed: 42
