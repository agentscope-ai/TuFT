backend:
  type: switch_tinker
  base_url: "http://localhost:10610"
  api_key: "tml-tuft-dev-key"
  base_model: "Qwen/Qwen3-4B-Base"
  switch_scheduler:
    policy: adaptive
    sampling_min_window_s: 3.0
    max_switch_overhead_fraction: 0.10
    adaptive_growth_factor: 1.5
    adaptive_window_s: 60.0
    switch_to_training_latency_s: 0.0
    switch_to_sampling_latency_s: 0.0

tenants: []

evaluation:
  eval_interval_steps: 0
  eval_sample_size: 0
  eval_temperature: 0.1

logprob_collection:
  enabled: false
  dump_per_token: false

output_path: "results/switch_tinker_smoke.json"
seed: 42
