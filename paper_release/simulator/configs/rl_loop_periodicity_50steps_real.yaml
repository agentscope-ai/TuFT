backend:
  type: tinker
  base_url: "http://localhost:10610"
  api_key: "tml-tuft-dev-key"
  base_model: "Qwen/Qwen3-4B-Base"

tenants:
  - id: "gsm8k-real-A"
    task: gsm8k
    request_rate: 2.0
    buffer_size: 4
    num_train_steps: 50
    lora_rank: 8
    learning_rate: 1e-4
    max_tokens: 64
    temperature: 0.7
    async_sampling: true
    async_sampling_concurrency: 2
    staleness_limit: 0

  - id: "countdown-real-B"
    task: countdown
    request_rate: 2.5
    async_sampling: true
    async_sampling_concurrency: 4
    buffer_size: 4
    num_train_steps: 50
    lora_rank: 8
    learning_rate: 1e-4
    max_tokens: 64
    temperature: 0.9
    staleness_limit: 1

  - id: "mbpp-real-C"
    task: mbpp
    request_rate: 3.0
    async_sampling: true
    async_sampling_concurrency: 6
    buffer_size: 4
    num_train_steps: 50
    lora_rank: 8
    learning_rate: 1e-4
    max_tokens: 64
    temperature: 0.7
    staleness_limit: 2

  - id: "humaneval-real-D"
    task: humaneval
    request_rate: 3.5
    async_sampling: true
    async_sampling_concurrency: 8
    buffer_size: 4
    num_train_steps: 50
    lora_rank: 16
    learning_rate: 1e-4
    max_tokens: 64
    temperature: 0.7
    staleness_limit: 3

evaluation:
  eval_interval_steps: 0
  eval_sample_size: 0
  eval_temperature: 0.1

logprob_collection:
  enabled: false
  dump_per_token: false

request_arrival_logging:
  enabled: true
  output_path: "results/rl_loop_periodicity_50steps/requests_real.jsonl"
  flush_every: 1

output_path: "results/rl_loop_periodicity_50steps/results_real.json"
seed: 42
