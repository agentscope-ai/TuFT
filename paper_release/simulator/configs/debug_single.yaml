backend:
  type: tinker
  base_url: "http://localhost:10610"
  api_key: "tml-tuft-dev-key"
  base_model: "Qwen/Qwen3-4B-Base"

tenants:
  - id: "debug-A"
    task: gsm8k
    request_rate: 4.0
    buffer_size: 2
    num_train_steps: 1
    lora_rank: 8
    learning_rate: 1e-4
    max_tokens: 32
    temperature: 0.7
    sync_mode: true
    staleness_limit: 0

evaluation:
  eval_interval_steps: 0
  eval_sample_size: 0
  eval_temperature: 0.1

logprob_collection:
  enabled: false
  dump_per_token: false

request_arrival_logging:
  enabled: false

output_path: "results/rl_loop_periodicity_50steps/debug_results.json"
seed: 42
