# TuFT server config for the Open Character Training example.
#
# Hardware layout on one machine with 2 x A100-80GB:
#   GPU 0: vLLM sampling engine (base model and saved LoRA adapters)
#   GPU 1: single-worker FSDP training backend
#
# Generate a key, replace both occurrences below, then launch:
#   python -c "import secrets; print('tml-' + secrets.token_urlsafe(24))"
#   CUDA_VISIBLE_DEVICES=0,1 tuft launch --host 0.0.0.0 --port 10610 \
#       --config examples/open_character_training/config.yaml

checkpoint_dir: ~/.cache/tuft/open-character-training
model_owner: local-user

supported_models:
  - model_name: Qwen/Qwen3.5-4B
    model_path: Qwen/Qwen3.5-4B
    max_model_len: 4096
    sampling_max_model_len: 4096
    tensor_parallel_size: 1
    data_parallel_size: 1
    sampling_enforce_eager: true

    # Sampling and training use separate GPUs. Two-rank FSDP would require a
    # third GPU because TuFT's vLLM sampler also owns one full GPU.
    colocate: false
    training_backend: fsdp
    fsdp_num_gpus: 1
    micro_batch_size: 2

    # This 2-A100 example uses rank 16, alpha 32 as a resource-friendly
    # deviation from the paper's rank 64, alpha 128 recipe. It still adapts all
    # attention and MLP projections. Qwen3.5 has no supported unembedding LoRA
    # target, so the effective set is q/k/v/o_proj plus gate/up/down_proj.
    max_lora_rank: 16
    lora_alpha_ratio: 2
    fsdp_train_attn: true
    fsdp_train_mlp: true
    fsdp_train_unembed: true
    fsdp_rank_slots: {16: 4}
    max_loras: 4

    temperature: 0.7
    top_p: 0.95

authorized_users:
  tml-CHANGE-ME: local-user

persistence:
  mode: DISABLE

telemetry:
  enabled: false
