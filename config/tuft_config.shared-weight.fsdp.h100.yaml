# Example settings; not the eager, long-context configuration of the saved agent run.
# Two FSDP ranks share their persistent base shards with one TP=2 sampler.
# A second TP=2 sampler remains available during training: four H100 GPUs total.
checkpoint_dir: /tmp/tuft-shared-weight-fsdp-checkpoints
authorized_users:
  tml-local-dev-key: local-user
supported_models:
  - model_name: Qwen/Qwen3-4B
    model_path: Qwen/Qwen3-4B
    max_model_len: 1024
    sampling_max_model_len: 1024
    training_backend: fsdp
    fsdp_num_gpus: 2
    fsdp_rank_slots: {8: 4}
    tensor_parallel_size: 2
    data_parallel_size: 2
    colocate: true
    sampling_memory_fraction: 0.45
    sampling_kv_cache_memory_bytes: 17179869184
    sampling_enforce_eager: false
    max_lora_rank: 8
    max_loras: 4
    micro_batch_size: 4
    scheduling:
      policy: shared_weight
      max_inflight_per_replica: 16
      max_queued_requests: 1024
      queue_timeout_s: 120
      locality_slack: 0.1
      merge_zero_adapters: true
      flex_max_inflight: 4
      flex_max_tokens: 544
      training_quiet_s: 0.05
      sampling_alignment_s: 0
