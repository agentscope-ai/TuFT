# MoE text profile: four H200 GPUs, preserving frozen-base FSDP sharding.
# Launch with VLLM_USE_AOT_COMPILE=0 to avoid vLLM 0.24 AOT serialization delays.
# Training measurements use flash-linear-attention==0.5.2 in the worker environment.
checkpoint_dir: /tmp/tuft-loopweave-fsdp-checkpoints
authorized_users:
  tml-local-dev-key: local-user
supported_models:
- model_name: Qwen/Qwen3.6-35B-A3B
  model_path: Qwen/Qwen3.6-35B-A3B
  max_model_len: 1024
  sampling_max_model_len: 1024
  training_backend: fsdp
  fsdp_num_gpus: 2
  fsdp_rank_slots:
    8: 4
  tensor_parallel_size: 2
  data_parallel_size: 2
  colocate: true
  sampling_memory_fraction: 0.45
  sampling_kv_cache_memory_bytes: 4294967296
  sampling_enforce_eager: false
  max_lora_rank: 8
  max_loras: 4
  micro_batch_size: 4
  scheduling:
    policy: loopweave
    max_inflight_per_replica: 128
    max_queued_requests: 1024
    queue_timeout_s: 120
    locality_slack: 0.1
    merge_zero_adapters: true
    flex_max_inflight: 64
    flex_max_tokens: 160
    training_quiet_s: 0.05
    sampling_alignment_s: 0.25
  sampling_language_model_only: true
  sampling_moe_backend: triton
  sampling_gdn_prefill_backend: triton
  sampling_max_num_seqs: 64
