# Throughput profile validated on two H100 80GB GPUs, Qwen3-4B, four tenants.
# Measurement used 32-token prompts, 512-token outputs and 4x64-token training
# batches. Recheck memory and drain latency before increasing these workloads.
# Both model copies and the KV pool remain resident on the shared GPU.
checkpoint_dir: /tmp/tuft-loopweave-checkpoints
authorized_users:
  tml-local-dev-key: local-user
supported_models:
  - model_name: Qwen/Qwen3-4B
    model_path: Qwen/Qwen3-4B
    max_model_len: 1024
    sampling_max_model_len: 1024
    training_backend: hf
    tensor_parallel_size: 1
    data_parallel_size: 2
    colocate: true
    sampling_memory_fraction: 0.45
    sampling_enforce_eager: false
    max_lora_rank: 8
    max_loras: 4
    micro_batch_size: 4
    scheduling:
      policy: loopweave
      max_inflight_per_replica: 128
      max_queued_requests: 1024
      queue_timeout_s: 120
      locality_slack: 0.1
      merge_zero_adapters: true
      flex_max_inflight: 64
      # Total reserved tokens per request, including all requested samples.
      flex_max_tokens: 544
      training_quiet_s: 0.05
      sampling_alignment_s: 0.25
