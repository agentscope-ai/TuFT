# Two GPUs: one HF trainer + colocated sampler, and one persistent sampler.
# Adjust model paths and the memory fraction for the deployment's GPU capacity.
# The shared GPU retains two model copies; this is not the paper's CUDA-IPC path.
checkpoint_dir: /tmp/tuft-loopweave-checkpoints
authorized_users:
  tml-local-dev-key: local-user
supported_models:
  - model_name: Qwen/Qwen3-0.6B
    model_path: Qwen/Qwen3-0.6B
    max_model_len: 2048
    training_backend: hf
    tensor_parallel_size: 1
    data_parallel_size: 2
    colocate: true
    sampling_memory_fraction: 0.45
    max_lora_rank: 16
    max_loras: 4
    scheduling:
      policy: loopweave
      max_inflight_per_replica: 32
      max_queued_requests: 1024
      queue_timeout_s: 120
      locality_slack: 0.1
      merge_zero_adapters: true
      flex_max_inflight: 4
      # Sum of prompt + max output tokens, multiplied by num_samples.
      flex_max_tokens: 256
      training_quiet_s: 0.05
      sampling_alignment_s: 0.05
