# TuFT Configuration Example
#
# This file contains all available configuration options for the TuFT server.
# Copy this file to your desired location and modify as needed.
#
# Usage:
#   tuft launch --config /path/to/your/tuft_config.yaml

# =============================================================================
# Checkpoint Directory
# =============================================================================
# Directory for storing model checkpoints and LoRA weights.
# Default: ~/.cache/tuft/checkpoints
checkpoint_dir: ~/.cache/tuft/checkpoints

# =============================================================================
# Model Owner
# =============================================================================
# Default owner for models created on this server.
model_owner: local-user

# =============================================================================
# Supported Models
# =============================================================================
# List of base models available for training and sampling.
# Each model requires:
#   - model_name: Unique identifier used in API calls
#   - model_path: Path to model checkpoint (local path or HuggingFace model ID)
#   - max_model_len: Maximum context length supported by the model
#
# Optional model settings:
#   - capabilities: Which sides of the service this model provides
#       (default: [training, sampling]). Only the backends required by the
#       declared capabilities are constructed, so only their GPU resources are
#       reserved:
#         - [training]: SFT / offline DPO profile. No vLLM sampling backend is
#           created. Training, checkpoints, and sampler-compatible weight
#           export all work; sampling and OpenAI inference requests return a
#           deterministic capability-disabled error.
#         - [sampling]: inference / rollout profile. No training backend,
#           optimizer state, or training GPU reservation. Base-model sampling
#           and existing sampler checkpoints work; training operations return
#           a capability-disabled error.
#         - [training, sampling]: current behavior, required for on-policy RL.
#       Changing capabilities and restarting is supported: persisted training
#       runs and sampling sessions of a disabled capability are preserved and
#       become usable again once the capability is re-enabled. An empty list
#       is rejected. colocate requires both capabilities.
#   - tensor_parallel_size: Number of GPUs for tensor parallelism (default: 1)
#   - temperature: Default sampling temperature (default: 1.0)
#   - top_p: Default nucleus sampling probability (default: 1.0)
#   - top_k: Default top-k sampling (default: -1, disabled)
#   - logprobs: Number of log probabilities to return (default: 0)
#   - seed: Random seed for reproducibility (default: 42)
#   - min_response_tokens: Minimum tokens to generate (default: 0)
#   - max_lora_rank: Maximum LoRA adapter rank (default: 16)
#   - max_loras: Maximum simultaneous LoRA adapters (default: 1)
#   - training_backend: Training implementation, "hf" or "fsdp" (default: hf)
#   - fsdp_num_gpus: Number of FSDP workers/GPUs (default: 1)
#   - fsdp_rank_slots: Preallocated LoRA slots by rank (default: 16 rank-8 slots
#       plus 8 max_lora_rank slots, or 16 slots at max_lora_rank when it is <= 8;
#       the same capacity for every target geometry)
#       Explicit maps define the only accepted ranks and must include max_lora_rank.
#       Lower these counts to trade concurrent training runs for GPU memory.
#   - fsdp_qv_only: Intentionally use only [q_proj, v_proj], overriding client
#       modifiers so Q/V-only checkpoints can be loaded (default: false)
#   - fsdp_target_modules: Explicit homogeneous target geometry for every FSDP slot
#       (default: null; inferred from the fsdp_train_* modifiers at startup)
#   - fsdp_target_parameters: Explicit fused-parameter targets (peft
#       target_parameters), e.g. the routed experts of Qwen3.5-based MoE models
#       (default: null; inferred from the fsdp_train_* modifiers at startup)
#   - fsdp_train_attn/fsdp_train_mlp/fsdp_train_unembed: Target geometry modifiers
#       (defaults: true/true/true)
#       FSDP target geometry is allocated at server startup and cannot be changed
#       while the server is running; restart with a new configuration to change it.
#   - qwen_gated_deltanet_full_lora: For Qwen3.5-based models, also target the
#       Gated DeltaNet A/B gate projections (default: false). The default targets
#       match Tinker's public train_attn geometry. Applies to HF and FSDP.
#   - lora_alpha_ratio: lora_alpha = rank * this ratio (default: 2)
#       Applies to both the "hf" and "fsdp" training backends, so the same rank
#       gets the same LoRA update scaling whichever backend serves the model.
#
#       BREAKING CHANGE: the "hf" backend previously used lora_alpha = rank
#       (ratio 1); "fsdp" already used 2. Deployments that must keep the old "hf"
#       scaling have to set `lora_alpha_ratio: 1` explicitly. Checkpoints record
#       their effective lora_alpha, and loading one whose alpha disagrees with
#       this setting is rejected rather than silently rescaling updates.
#   - colocate: Colocate sampling and training on same device (default: false)
#   - sampling_memory_fraction: GPU memory fraction for sampling (default: 0.2)
#   - quantization: Quantization method for sampling (default: none)
#   - enable_auto_tool_choice: vLLM OpenAI API auto tool choice (qwenpaw ReAct)
#   - tool_call_parser: vLLM tool parser (e.g. hermes for Qwen3-Thinking)
#   - reasoning_parser: vLLM reasoning parser (e.g. qwen3)

supported_models:
  - model_name: Qwen/Qwen3-4B
    model_path: Qwen/Qwen3-4B
    max_model_len: 32768
    # Give this model's GPUs entirely to one side of the service by declaring a
    # single capability. Omit for the default [training, sampling]:
    # capabilities: [training]
    tensor_parallel_size: 1
    temperature: 0.7
    top_p: 1.0
    top_k: -1
    max_lora_rank: 16
    max_loras: 1
    lora_alpha_ratio: 2
    # FSDP creates every adapter slot before sharding. By default these modifiers
    # match Tinker's LoraConfig defaults and resolve to attention + MLP modules on
    # Qwen. A client request with different modifiers is rejected clearly.
    # training_backend: fsdp
    # fsdp_num_gpus: 2
    # fsdp_train_attn: true
    # fsdp_train_mlp: true
    # fsdp_train_unembed: true
    # Keep false for Tinker-compatible Qwen3.5 defaults. Set true to add LoRA to
    # linear_attn.in_proj_a and linear_attn.in_proj_b on both training backends:
    # qwen_gated_deltanet_full_lora: false
    # Set this only when Q/V-only geometry is intentional. It overrides client
    # modifiers and allows checkpoints targeting [q_proj, v_proj] to seed or
    # restore a run. An explicit [q_proj, v_proj] list without this opt-in is
    # rejected so the override cannot happen accidentally:
    # fsdp_qv_only: false
    # Or specify the exact homogeneous module set instead of the modifiers. For a
    # supported model series, every client request must resolve to this exact list;
    # a mismatch returns HTTP 400 and does not create the training run. For an
    # unsupported model family, the explicit list supplies the geometry because
    # its client modifiers cannot be resolved:
    # fsdp_target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]
    # Other checkpoints can be loaded only when their recorded target modules
    # match the preallocated geometry and the destination run's effective modules.
    # Every slot is materialized eagerly before sharding, so slot counts set the
    # floor on preallocated adapter memory. That memory is a small fraction of
    # the frozen base model even for the widest target set, so the defaults keep
    # capacity constant across geometries. Reduce the counts when you need the
    # memory back and can serve fewer concurrent training runs; a single-tenant
    # deployment can go as low as one slot per rank:
    # fsdp_rank_slots: {8: 8, 16: 2}

  - model_name: Qwen/Qwen3-8B
    model_path: Qwen/Qwen3-8B
    max_model_len: 32768
    tensor_parallel_size: 1
    temperature: 1.0
    top_p: 1.0
    top_k: -1
    max_lora_rank: 16
    max_loras: 1

# =============================================================================
# Authentication
# =============================================================================
# API key to user mapping for authentication.
# Format: api_key: user_id
#
# Note: This is a temporary implementation. Replace with proper auth system
# for production use.

authorized_users:
  # Example: my-secret-api-key: admin-user
  local-dev-key: local-user

# =============================================================================
# Persistence Configuration
# =============================================================================
# Configure state persistence for recovery after server restart.
# For detailed documentation, see the "Persistence" section in README.md.
#
# Available modes:
#   - DISABLE: No persistence (default)
#   - REDIS: External Redis server
#   - FILE: File-backed store

persistence:
  mode: DISABLE  # Options: DISABLE, REDIS, FILE

  # For REDIS mode:
  # redis_url: "redis://localhost:6379/0"

  # For FILE mode:
  # file_path: "~/.cache/tuft/file_redis.json"

  # Namespace prefix for Redis keys. (optional, defaults to "persistence-tuft-server".)
  # namespace: "persistence-tuft-server"

  # TTL (Time-To-Live) for future records in seconds.
  # Futures are short-lived async operation results that expire after this duration.
  # Set to null for no expiry (not recommended for production).
  # Default: 86400 (1 day)
  # future_ttl_seconds: 86400

  # Fields to validate on server restart for config consistency.
  # For detailed documentation on available fields and config validation,
  # see the "Configuration Validation" section in README.md.
  # Defaults to ["SUPPORTED_MODELS"]. SUPPORTED_MODELS is always checked.
  # check_fields:
  #   - SUPPORTED_MODELS
  #   - CHECKPOINT_DIR

# =============================================================================
# Telemetry Configuration (OpenTelemetry)
# =============================================================================
# Configure observability with distributed tracing, metrics, and logging.
#
# Environment variables (alternative to config):
#   - TUFT_OTLP_ENDPOINT: OTLP collector endpoint
#   - TUFT_OTEL_DEBUG: Enable console exporter for debugging

telemetry:
  enabled: false
  service_name: tuft

  # OTLP exporter endpoint (gRPC)
  # otlp_endpoint: http://localhost:4317

  # Additional resource attributes for traces/metrics
  resource_attributes: {}
    # deployment.environment: production
    # service.version: 1.0.0
    # service.namespace: my-namespace
