<svg xmlns="http://www.w3.org/2000/svg" width="980" height="650" viewBox="0 0 980 650" role="img" aria-labelledby="title desc">
  <title id="title">How a client-defined loss runs on TuFT</title>
  <desc id="desc">The client requests token log-probabilities, calculates its loss and derivatives locally, and sends token weights to a second server pass that accumulates the model gradient.</desc>
  <defs>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#15803d"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect x="20" y="20" width="940" height="610" rx="24" fill="#f8fafc" stroke="#cbd5e1"/>

  <rect x="60" y="48" width="385" height="54" rx="12" fill="#dbeafe"/>
  <text x="252.5" y="82" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="700" fill="#1e3a8a">Your client process</text>
  <rect x="535" y="48" width="385" height="54" rx="12" fill="#dcfce7"/>
  <text x="727.5" y="82" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="700" fill="#14532d">TuFT server</text>

  <circle cx="76" cy="155" r="22" fill="#2563eb"/>
  <text x="76" y="162" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" fill="#ffffff">1</text>
  <rect x="110" y="122" width="300" height="80" rx="12" fill="#ffffff" stroke="#93c5fd" filter="url(#shadow)"/>
  <text x="260" y="154" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="650" fill="#0f172a">Request target-token</text>
  <text x="260" y="180" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="650" fill="#0f172a">log-probabilities</text>
  <line x1="415" y1="150" x2="545" y2="150" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow-blue)"/>
  <rect x="555" y="122" width="325" height="80" rx="12" fill="#ffffff" stroke="#86efac" filter="url(#shadow)"/>
  <text x="717.5" y="154" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="650" fill="#0f172a">Run a forward pass</text>
  <text x="717.5" y="180" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="16" fill="#475569">No update and no saved gradients</text>
  <path d="M 555 190 C 510 230, 455 230, 410 190" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow-blue)"/>
  <text x="482" y="232" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="15" fill="#475569">Return one score per target token</text>

  <circle cx="76" cy="330" r="22" fill="#7c3aed"/>
  <text x="76" y="337" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" fill="#ffffff">2</text>
  <rect x="110" y="278" width="770" height="104" rx="14" fill="#ffffff" stroke="#c4b5fd" filter="url(#shadow)"/>
  <text x="495" y="315" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="19" font-weight="700" fill="#4c1d95">Calculate the custom loss in PyTorch on the client</text>
  <text x="495" y="346" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17" fill="#334155">loss → derivative for each log-probability</text>
  <text x="495" y="370" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="15" fill="#64748b">The callback never runs on the server</text>

  <circle cx="76" cy="467" r="22" fill="#15803d"/>
  <text x="76" y="474" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" fill="#ffffff">3</text>
  <rect x="110" y="424" width="300" height="86" rx="12" fill="#ffffff" stroke="#93c5fd" filter="url(#shadow)"/>
  <text x="260" y="458" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="650" fill="#0f172a">Send negative derivatives</text>
  <text x="260" y="484" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="16" fill="#475569">as per-token weights</text>
  <line x1="415" y1="467" x2="545" y2="467" stroke="#15803d" stroke-width="3" marker-end="url(#arrow-green)"/>
  <rect x="555" y="424" width="325" height="86" rx="12" fill="#ffffff" stroke="#86efac" filter="url(#shadow)"/>
  <text x="717.5" y="458" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="650" fill="#0f172a">Run forward + backward</text>
  <text x="717.5" y="484" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="16" fill="#475569">Accumulate the model gradient</text>

  <path d="M 495 530 L 495 554" stroke="#15803d" stroke-width="3" marker-end="url(#arrow-green)"/>
  <rect x="190" y="565" width="610" height="44" rx="22" fill="#dcfce7" stroke="#86efac"/>
  <text x="495" y="593" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#14532d">Same model gradient as differentiating the custom loss directly</text>
</svg>
